<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thời khóa biểu</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>THỜI KHÓA BIỂU</h1>

    <table>
        <tr>
            <th>Tiết</th>
            <th>Thứ Hai</th>
            <th>Thứ Ba</th>
            <th>Thứ Tư</th>
            <th>Thứ Năm</th>
            <th>Thứ Sáu</th>
            <th>Thứ Bảy</th>
        </tr>

        <tr>
            <td colspan="7"><b>BUỔI SÁNG</b></td>
        </tr>

        <tr>
            <td>1</td>
            <td>Chào cờ</td>
            <td>Tin</td>
            <td>KTPL</td>
            <td>Văn</td>
            <td>GDQP</td>
            <td>Toán</td>
        </tr>

        <tr>
            <td>2</td>
            <td>SHCN</td>
            <td>Anh</td>
            <td>Anh</td>
            <td>Văn</td>
            <td>Tin</td>
            <td>Toán</td>
        </tr>

        <tr>
            <td>3</td>
            <td>GDDP</td>
            <td>TD</td>
            <td>Toán</td>
            <td>Anh</td>
            <td>KTPK</td>
            <td>Văn</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Hóa</td>
            <td>TD</td>
            <td>Toán</td>
            <td>Địa</td>
            <td>Sử</td>
            <td>Văn</td>
        </tr>

        <tr>
            <td colspan="7"><b>BUỔI CHIỀU</b></td>
        </tr>
    </table>

</body>
</html>
